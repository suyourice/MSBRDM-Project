# Cartesian PDG Controller Configuration
# ROBUST: Jacobian transpose with error saturation + force clamping + damping
# Control law: F = Kp * saturate(e_pos), F = clamp(F, 30N), tau = J^T * F - Kd * qp
# Safety: max_error=0.5m, max_force=30N, max_torque=100Nm

cartesian_pdg_controller:
  # Task-space position stiffness (N/m)
  # Lower values = smoother motion, higher values = faster convergence
  Kp_pos: [80.0, 80.0, 80.0]
  # Orientation stiffness (enable if you want gripper direction control)
  Kp_ori: [10.0, 10.0, 10.0]

  # Joint-space damping (Nm·s/rad)
  # Higher values = more stability, lower values = faster response
  Kd_q: [15.0, 15.0, 15.0, 12.0, 12.0, 12.0]

  # Joint-space proportional term (integrated velocity reference)
  # Helps overcome gravity/model mismatch in PDG mode
  use_joint_p: true
  Kp_q: [80.0, 80.0, 80.0, 50.0, 50.0, 50.0]

  # Maximum Cartesian velocity
  max_lin_velocity: 0.1
  max_ori_velocity: 0.3

  # Maximum joint torque (Nm)
  max_torque: 100.0

  # Damping factor (for pseudo-inverse, not used)
  damping_factor: 0.01

  # Disable extra task-space Jᵀ term (pure PDG)
  task_pd: false

  # Gravity compensation using DynamicModel::G()
  use_gravity_comp: true

  # Tolerances
  position_tolerance: 0.01
  orientation_tolerance: 0.05

  # INSERTION_ADMITTANCE mode parameters (peg-in-hole assembly)
  insertion:
    # Circular search trajectory
    radius: 0.003              # 3mm circular search radius (m)
    omega: 0.5                 # Angular velocity for circular motion (rad/s)
    v_descent: 0.002           # Z-axis descent velocity (m/s) - 2mm/s

    # Success detection
    z_target: 0.025            # Target insertion depth (m) - 25mm
    force_drop_threshold: 3.0  # Force drop threshold for success (N)

    # XY Admittance dynamics (force compliance)
    admittance:
      mass_xy: [0.5, 0.5]      # Virtual mass (kg) - XY plane only
      damping_xy: [50.0, 50.0] # Damping coefficient (Ns/m) - XY plane only
      max_displacement: 0.02   # Safety limit on compliance displacement (m) - 20mm
