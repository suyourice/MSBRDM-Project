# Peg-in-Hole Finite State Machine Configuration

peg_in_hole_fsm:
  # Safe position (joint angles in degrees)
  q_safe: [0, -90, 72, -90, -90, 0]

  # Coordinate frame: Robot base link origin
  #   x: forward (toward robot front)
  #   y: left (robot left side)
  #   z: up (vertical, ground is z=0)

  # Peg position (x, y, z in meters)
  p_peg: [0.85, 0.2, 0.01]

  # Hole position (x, y, z in meters)
  p_hole: [0.8, -0.2, 0.04]

  # Optional frame transform (visual/URDF -> controller frame)
  # Use this if RViz coordinates do not match controller motion.
  # p_controller = R * p_visual + t
  # Enable this to align RViz/URDF coordinates with the controller frame.
  use_frame_transform: true
  # Calibrated from your TF vs controller positions (approx)
  frame_rpy_deg: [0, 0, 180]
  frame_xyz: [-0.149, -0.005, -0.033]
  
  # Tool transform (ee -> tool), used to align gripper tip with target pose
  # These values are derived from the URDF lacquey adapter + gripper joints.
  # Adjust if your gripper appears tilted or offset.
  tool_rpy_deg: [0, 0, 0]
  tool_xyz: [0.2, 0.0, 0.0]

  # Gripper orientation for grasping (roll, pitch, yaw in degrees)
  # [180, 0, 0]: gripper pointing down (for top-down grasping)
  peg_orientation: [180, 0, 0]

  # Retry logic
  max_retries: 3

  # ArUco marker detection (if available)
  use_aruco: false

  # State timeouts (seconds)
  # These are automatically set in code, but can be overridden here
  # timeouts:
  #   HOME: 10.0
  #   OPEN_GRIPPER: 2.0
  #   MOVE_TO_PEG: 15.0
  #   DESCEND_TO_PEG: 10.0
  #   CLOSE_GRIPPER: 2.0
  #   LIFT_PEG: 5.0
  #   MOVE_ABOVE_HOLE: 15.0
  #   ALIGN_ORIENTATION: 5.0
  #   CIRCULAR_INSERTION: 30.0
